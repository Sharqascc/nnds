name: Nightly Integration

on:
  schedule:
    - cron: '0 3 * * *'  # 3 AM UTC daily
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Run integration and smoke tests
        run: |
          pytest tests/ -m "integration or smoke" -q

      - name: Deep property tests
        # Hypothesis with 2500 examples per property. Not a PR gate -
        # purely informational, to surface rare counterexamples that
        # the 300-example PR profile misses.
        env:
          HYPOTHESIS_PROFILE: ci-deep
        run: |
          pytest tests/ -m property -q -o addopts= \
            -n auto --timeout=300
