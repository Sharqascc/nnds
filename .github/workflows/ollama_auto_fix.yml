name: Ollama Auto-Fix

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ollama-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout hypothesis ruff mypy groq ipython
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi

      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve > /tmp/ollama.log 2>&1 &
          sleep 5
          ollama pull qwen2.5-coder:7b

      - name: Run Ollama agentic fixer (apply patches only)
        env:
          OLLAMA_AUTO_FIX_BRANCH: 'false'
        run: |
          python scripts/agentic_fix_ollama.py

      - name: Run full fast test suite
        run: |
          pytest tests/ -m "not integration and not slow and not smoke"             --ignore=tests/test_snapshot_bev_mapper.py             --ignore=tests/test_snapshot_pet_summary.py             -q --tb=short

      - name: Create branch, commit, and push if tests passed
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            BRANCH="auto-fix-ollama-$(date +%Y%m%d-%H%M%S)"
            git checkout -b $BRANCH
            git add -A
            git commit -m "Auto-fix (Ollama): apply local LLM patches"
            git push --no-verify origin $BRANCH
            gh pr create --base ${{ github.ref_name }} --head $BRANCH --title "Ollama Auto-Fix" --body "Automated fixes generated by local Ollama agent."
          else
            echo "No changes to commit."
          fi
