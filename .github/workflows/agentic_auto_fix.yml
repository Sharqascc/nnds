name: Agentic Auto-Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agentic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Run agentic fixer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/agentic_fix.py
