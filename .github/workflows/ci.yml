# Tiered CI: static analysis, three parallel test lanes, combined coverage gate.
#
# Security posture:
#   - Workflow-level `permissions: contents: read` (least privilege).
#   - Every checkout uses `persist-credentials: false` so the token is not
#     left in `.git/config` for subsequent `pip install` scripts to read.
#   - No job pushes to the repository. Formatting is check-only; a failing
#     check is a red CI, not an auto-fix. This closes CodeRabbit's
#     "Security Misconfiguration" finding and qodo's "Failed formatting
#     pushes still pass ci".
#
# Coverage files use names WITHOUT a leading dot (`coverage.fast`, etc.) so
# actions/upload-artifact@v4 sees them — it skips dotfiles by default.
# Coverage gating is done ONCE in the combined `coverage` job at 70%.
name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vlm.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Compile all Python files
        run: python -m compileall -q src tests scripts conftest.py
      - name: Lint (Ruff)
        run: ruff check .
      - name: Format check (Ruff)
        run: ruff format --check .
      - name: Run mypy type checking (analysis)
        shell: bash
        run: |
          set -o pipefail
          mypy --config-file mypy.ini src/ paper/analysis/ scripts/ 2>&1 | head -50
      - name: Run bandit (SAST)
        run: bandit -c bandit.yaml -r src/ paper/analysis/ scripts/ -ll
      - name: Run pylint (non-blocking, reports score)
        run: |
          pylint src/paper 2>/dev/null || true
          pylint src/pipeline src/analysis --score=y --exit-zero 2>&1 | tail -30
      - name: Check shell syntax
        run: |
          shopt -s nullglob
          for f in scripts/*.sh .githooks/pre-commit .githooks/pre-push; do
            bash -n "$f"
          done
      - name: Fetch tags (for archive-index drift check)
        run: git fetch --tags

  test-fast:
    name: Fast unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vlm.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Run fast unit tests
        run: |
          pytest tests/ -n auto --dist=loadfile \
            -m "not integration and not smoke and not full and not slow and not property" \
            --cov=src --cov=paper/analysis --cov-branch --cov-report= \
            --durations=25
      - name: Rename coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then cp .coverage coverage.fast; fi
          ls -la coverage.fast || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-fast
          path: coverage.fast
          if-no-files-found: warn

  test-property:
    name: Property tests (hypothesis ci-pr)
    runs-on: ubuntu-latest
    env:
      HYPOTHESIS_PROFILE: ci-pr
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vlm.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Run property tests
        run: |
          pytest tests/ -m property -q -n auto --dist=loadfile \
            --cov=src --cov=paper/analysis --cov-branch --cov-report= \
            --ignore=tests/test_snapshot_pet_summary.py
      - name: Rename coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then cp .coverage coverage.property; fi
          ls -la coverage.property || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-property
          path: coverage.property
          if-no-files-found: warn

  test-full:
    name: Full / smoke / integration / slow (${{ matrix.subset }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - subset: integration
            marker: integration
            coverage: coverage.full.integration
          - subset: smoke
            marker: smoke
            coverage: coverage.full.smoke
          - subset: full-or-slow
            marker: "full or slow"
            coverage: coverage.full
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-vlm.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi
      - name: Run ${{ matrix.subset }} tests
        run: |
          pytest tests/ -m "${{ matrix.marker }}" -q -n auto --dist=loadfile \
            --cov=src --cov=paper/analysis --cov-branch --cov-report= \
            --ignore=tests/test_snapshot_pet_summary.py \
            --durations=25
      - name: Rename coverage data
        if: always()
        run: |
          if [ -f .coverage ]; then cp .coverage ${{ matrix.coverage }}; fi
          ls -la ${{ matrix.coverage }} || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.coverage }}
          path: ${{ matrix.coverage }}
          if-no-files-found: warn

  coverage:
    name: Coverage gate (combined)
    needs: [test-fast, test-property, test-full]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          path: cov-artifacts
      - name: List what we got (for debugging)
        run: find cov-artifacts -type f | sort
      - name: Combine and gate
        run: |
          # Require ALL three lanes to have produced coverage. If a lane
          # silently produced none, the reported combined number would be a
          # subset, not the intended union.
          # Expected artifacts:
          #   coverage-fast / coverage.fast
          #   coverage-property / coverage.property
          #   coverage.full.integration / coverage.full.integration
          #   coverage.full.smoke       / coverage.full.smoke
          #   coverage.full             / coverage.full           (from full-or-slow)
          # The three full sub-lanes are recombined into coverage.full.
          found=0
          for pair in "coverage-fast/coverage.fast" \
                      "coverage-property/coverage.property" \
                      "coverage.full.integration/coverage.full.integration" \
                      "coverage.full.smoke/coverage.full.smoke" \
                      "coverage.full/coverage.full"; do
            f="cov-artifacts/$pair"
            if [ -f "$f" ]; then
              cp "$f" "$(basename "$f")"
              found=$((found+1))
              echo "loaded $f"
            else
              echo "MISSING: $f"
            fi
          done
          if [ "$found" -ne 5 ]; then
            echo "::error::Expected 5 coverage artifacts (fast, property, integration, smoke, full-or-slow); found $found."
            exit 1
          fi
          # Combine the three full sub-lane files into one coverage.full before
          # merging them into the aggregate.
          cp coverage.full.integration coverage.full.integration.tmp
          cp coverage.full.smoke       coverage.full.smoke.tmp
          cp coverage.full              coverage.full.tmp
          mv coverage.full.integration.tmp .coverage.full.integration
          mv coverage.full.smoke.tmp       .coverage.full.smoke
          mv coverage.full.tmp             .coverage.full
          coverage combine --append
          # Now the aggregate combine for the three top-level lanes.
          for lane in fast property full; do
            [ -f "coverage.$lane" ] && mv "coverage.$lane" ".coverage.$lane"
          done
          coverage combine
          coverage report --fail-under=70

  # ---------------------------------------------------------------------------
  # Synthetic gate required by branch protection on `main`.
  #
  # The rule on main requires a status check named exactly "test". Before the
  # CI-tiering rework (#52) the single CI job was named "test"; after the
  # rework it was split into four lanes with different names. Rather than
  # expand the branch-protection rule to five job names (brittle, and it needs
  # admin scope to edit), this job collapses the four lanes back into one
  # authoritative check named "test".
  #
  # `if: always()` is required: without it the job is skipped when an upstream
  # lane fails, and a skipped required check stays pending forever.
  # ---------------------------------------------------------------------------
  test:
    name: test
    needs: [static, test-fast, test-property, test-full, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify every lane succeeded
        run: |
          echo "Upstream lane results:"
          echo "  static        = ${{ needs.static.result }}"
          echo "  test-fast     = ${{ needs.test-fast.result }}"
          echo "  test-property = ${{ needs.test-property.result }}"
          echo "  test-full     = ${{ needs.test-full.result }}"
          echo "  coverage      = ${{ needs.coverage.result }}"
          if [ "${{ needs.static.result }}"        != "success" ] || \
             [ "${{ needs.test-fast.result }}"     != "success" ] || \
             [ "${{ needs.test-property.result }}" != "success" ] || \
             [ "${{ needs.test-full.result }}"     != "success" ] || \
             [ "${{ needs.coverage.result }}"      != "success" ]; then
            echo "::error::One or more required lanes did not succeed."
            exit 1
          fi
          echo "All required lanes succeeded."
