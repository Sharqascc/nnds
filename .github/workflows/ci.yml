name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

# Cancel in-flight runs for the same ref. push + pull_request both trigger
# for a branch with an open PR; this keeps one active run per ref instead
# of two.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi

      - name: Compile all Python files
        run: python -m compileall -q src tests scripts

      - name: Lint with Ruff
        run: ruff check src tests scripts

      - name: Check formatting with Ruff
        run: ruff format --check src tests scripts

      - name: Run fast unit tests with coverage
        run: |
          pytest tests/ -m "not integration and not slow" \
            --cov=src --cov-branch --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run mypy type checking (analysis)
        run: mypy --config-file mypy.ini src/analysis

      - name: Run property tests
        run: |
          pytest tests/ -m property -q \
            --ignore=tests/test_snapshot_pet_summary.py

      - name: Run smoke tests (integration)
        run: |
          pytest tests/ -m "integration or smoke" -q \
            --ignore=tests/test_snapshot_pet_summary.py
