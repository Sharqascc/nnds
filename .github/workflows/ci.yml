name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

# Cancel in-flight runs for the same ref. push + pull_request both trigger
# for a branch with an open PR; this keeps one active run per ref instead
# of two.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi

      - name: Compile all Python files
        run: python -m compileall -q src tests scripts conftest.py

      - name: Lint with Ruff (auto-fix)
        run: |
          ruff check --fix .
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "style: auto-fix lint via CI"
          fi
          ruff check .

      - name: Auto-format with Ruff
        run: |
          ruff format .
          if ! git diff --quiet; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "style: auto-format via CI"
          fi
          git push

      - name: Run mypy type checking (analysis)
        run: mypy --config-file mypy.ini src/ paper/analysis/ scripts/ 2>&1 | head -50

      - name: Run bandit (SAST)
        run: bandit -c bandit.yaml -r src/ paper/analysis/ scripts/ -ll

      - name: Run pylint (non-blocking, reports score)
        run: |
          pylint src/paper 2>/dev/null || true
          pylint src/pipeline src/analysis --score=y --exit-zero 2>&1 | tail -30

      - name: Check shell syntax
        run: |
          shopt -s nullglob
          for f in scripts/*.sh .githooks/pre-commit .githooks/pre-push; do
            bash -n "$f"
          done

      - name: Fetch tags (for archive-index drift check)
        run: git fetch --tags

      - name: Run fast unit tests with coverage
        run: |
          pytest tests/ -m "not integration and not slow" \
            --cov=src --cov=paper/analysis --cov-branch --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run property tests
        env:
          HYPOTHESIS_PROFILE: ci-pr
        run: |
          pytest tests/ -m property -q \
            --ignore=tests/test_snapshot_pet_summary.py

      - name: Run smoke tests (integration)
        run: |
          pytest tests/ -m "integration or smoke" -q \
            --ignore=tests/test_snapshot_pet_summary.py
