name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-timeout hypothesis pytest-mock syrupy pydantic ipython
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-vlm.txt ]; then pip install -r requirements-vlm.txt; fi

      - name: Run fast unit tests with coverage
        run: |
          pytest tests/ -m "not integration and not slow" \
            --ignore=tests/test_snapshot_bev_mapper.py \
            --ignore=tests/test_snapshot_pet_summary.py \
            --cov=src --cov-branch --cov-report=term-missing \
            --cov-fail-under=70

      - name: Run smoke tests (integration)
        run: pytest tests/ -m "integration or smoke" -q \
          --ignore=tests/test_snapshot_bev_mapper.py \
          --ignore=tests/test_snapshot_pet_summary.py
