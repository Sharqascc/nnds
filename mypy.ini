[mypy]
python_version = 3.10
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
warn_unused_ignores = False
warn_redundant_casts = False

[mypy-src.diffusion.*]
ignore_errors = True

[mypy-src.analysis.grid_trajectory.uvh_coco_fused_grid_pet]
ignore_errors = True

[mypy-src.analysis.grid_trajectory.sam3_grid_pet]
ignore_errors = True

[mypy-src.analysis.visualization.*]
ignore_errors = True

[mypy-src.analysis.ssm.*]
ignore_errors = True

[mypy-src.analysis.verification.*]
ignore_errors = True

[mypy-src.vlm.*]
ignore_errors = True

[mypy-src.pipeline.*]
ignore_errors = True

[mypy-src.bev.*]
ignore_errors = True
