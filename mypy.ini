[mypy]
python_version = 3.13
ignore_missing_imports = True
follow_imports = skip
check_untyped_defs = True
warn_unused_ignores = False
warn_redundant_casts = False


[mypy-src.analysis.grid_trajectory.sam3_grid_pet]
ignore_errors = True

[mypy-src.analysis.visualization.*]
ignore_errors = True

[mypy-src.analysis.ssm.*]
ignore_errors = True

[mypy-src.analysis.verification.*]
ignore_errors = True

# Dev tools — not part of the paper artifact. Interactive helpers.
[mypy-scripts.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False
allow_untyped_globals = True
allow_redefinition = True
disable_error_code = attr-defined, var-annotated, operator, assignment, return-value

# Paper analysis — research code. Keep most checks, relax pandas/numpy patterns.
[mypy-paper.analysis.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = True
allow_untyped_globals = True
disable_error_code = var-annotated
