[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "nnds"
version = "0.1.0"
description = "Neural Network Diffusion for Traffic Safety"
authors = [
    { name = "Sharqascc", email = "sharqascc@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "ultralytics>=8.4.178,<8.5",
    "opencv-python>=5.0.0,<5.1",
    "numpy>=2.5.4,<2.6",
    "pandas>=3.0.6,<3.1",
    "scipy>=1.18.1,<1.19",
    "matplotlib>=3.11.2,<3.12",
    "tqdm>=4.70.1,<4.71",
    "PyYAML>=6.0.3,<6.1",
    "openvino>=2026.4.1,<2026.5",
    "lap>=0.5.13,<0.6",
    "scikit-learn>=1.9.1,<1.10",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0",
    "pytest-cov>=7.1.0,<8.0",
    "pytest-timeout>=2.4.0,<3.0",
    "pytest-mock>=3.16.0,<4.0",
    "hypothesis>=6.170.0,<7.0",
    "syrupy>=6.1.1,<7.0",
    "ruff>=0.17.1,<0.18",
    "mypy>=2.4.0,<2.5",
    "groq>=1.7.0,<2.0",
    "pydantic>=2.14.1,<3.0",
    "ipython>=9.17.1,<10.0",
]

[project.scripts]
nnds = "pipeline.traffic_analyzer:main"
# Full pipeline runner: model preflight, seeding, dispatch.
nnds-run = "scripts.run_pipeline:main"
validate-nnds-outputs = "scripts.validate_outputs:main"
paired-ttest = "scripts.paired_ttest:main"
validate-contracts = "scripts.validate_contracts:main"
inspect-pet = "scripts.inspect_pet:main"
generate-pet-verification-video = "scripts.generate_pet_verification_video:main"
validation-report = "scripts.validation_report:main"
estimate-time-of-day = "scripts.estimate_time_of_day:main"
generate-safety-report-groq = "scripts.generate_safety_report_groq:main"
evaluate-tracking-metrics = "scripts.evaluate_tracking_metrics:main"
tracking-report = "scripts.tracking_report:main"
tracking-report-fast = "scripts.tracking_report_fast:main"
validate-all = "scripts.validate_all:main"

[tool.black]
line-length = 100
target-version = [
    "py310",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.coverage.run]
omit = [
    "src/analysis/safety_eval_diffusion_notebook.py",
]

[tool.setuptools]
packages.find.include = ["*", "scripts"]
packages.find.where = ["src"]

