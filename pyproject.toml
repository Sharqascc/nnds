[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "nnds"
version = "0.1.0"
description = "Neural Network Diffusion for Traffic Safety"
authors = [
    { name = "Sharqascc", email = "sharqascc@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision",
    "ultralytics>=8.0.0",
    "opencv-python",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "tqdm",
    "PyYAML",
    "openvino>=2024.0.0",
    "lap>=0.5.12",
    "scikit-learn",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.2.0",
    "pytest-mock",
    "hypothesis>=6.100.0",
    "syrupy>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "groq>=0.30.0",
    "pydantic",
    "ipython",
]

[project.scripts]
nnds = "pipeline.traffic_analyzer:main"
validate-nnds-outputs = "scripts.validate_outputs:main"
paired-ttest = "scripts.paired_ttest:main"
validate-contracts = "scripts.validate_contracts:main"
inspect-pet = "scripts.inspect_pet:main"
generate-pet-verification-video = "scripts.generate_pet_verification_video:main"
validation-report = "scripts.validation_report:main"
estimate-time-of-day = "scripts.estimate_time_of_day:main"
generate-safety-report-groq = "scripts.generate_safety_report_groq:main"
evaluate-tracking-metrics = "scripts.evaluate_tracking_metrics:main"
tracking-report = "scripts.tracking_report:main"
tracking-report-fast = "scripts.tracking_report_fast:main"
validate-all = "scripts.validate_all:main"

[tool.black]
line-length = 100
target-version = [
    "py310",
]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = [
    "tests",
]


[tool.coverage.run]
omit = [
    "src/analysis/safety_eval_diffusion_notebook.py",
]

[tool.setuptools]
packages.find.include = ["*", "scripts"]
packages.find.where = ["src"]

